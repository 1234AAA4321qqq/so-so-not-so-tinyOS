name: Build ISO

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-iso:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Install live-build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            live-build \
            debootstrap \
            squashfs-tools \
            xorriso \
            isolinux \
            syslinux-common \
            syslinux-efi \
            grub-efi-amd64-bin \
            grub-pc-bin \
            mtools \
            dosfstools \
            wget \
            curl

      - name: Configure the build
        run: sudo ./auto/config

      - name: Build the ISO
        run: sudo env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin HOME=/root ./auto/build

      - name: Show output
        run: ls -lh output/ && du -sh output/*

      - name: Upload ISO as artifact
        uses: actions/upload-artifact@v4
        with:
          name: soso-tinyos-iso
          path: output/*.iso
          retention-days: 30

      - name: Attach ISO to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: output/*.iso
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}